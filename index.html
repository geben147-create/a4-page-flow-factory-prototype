<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A4 PFF Pipeline Studio — Prototype</title>
<style>
:root {
  --bg:#F4F4F4; --surface:#FFFFFF; --surface-alt:#F9F9F9; --surface-2:#EDEDED;
  --border:#E0E0E0; --border-strong:#C6C6C6;
  --text:#161616; --text-secondary:#525252; --text-tertiary:#8D8D8D;
  --accent:#0F62FE; --accent-hover:#0353E9; --accent-bg:#EDF5FF;
  --success:#198038; --success-bg:#DEFBE6;
  --warning:#F1C21B; --warning-bg:#FFF8E1;
  --danger:#DA1E28; --danger-bg:#FFF1F1;
  --running:#0F62FE;
  --header-bg:#161616; --header-text:#FFFFFF;
  --font: "IBM Plex Sans", -apple-system, "Segoe UI", "Noto Sans KR", Pretendard, sans-serif;
  --mono: ui-monospace, "IBM Plex Mono", "Cascadia Code", Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin:0; padding:0; height:100%; }
body { font-family: var(--font); font-size: 14px; color: var(--text); background: var(--bg); -webkit-font-smoothing: antialiased; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; padding: 0; }
input, textarea, select { font-family: inherit; color: inherit; }
a { color: var(--accent); text-decoration: none; }
kbd { font-family: var(--mono); font-size: 11px; padding: 2px 6px; background: var(--surface-2); border-radius: 3px; border: 1px solid var(--border); }

/* === Header (Studio) === */
.studio-header {
  height: 48px; background: var(--header-bg); color: var(--header-text);
  display: flex; align-items: center; padding: 0 var(--space-4);
  position: sticky; top: 0; z-index: 50; gap: 16px;
}
.studio-header .ham {
  width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;
  color: #fff;
}
.studio-header .ham:hover { background: rgba(255,255,255,0.1); }
.studio-header .brand { font-weight: 600; font-size: 14px; }
.studio-header .brand .ibm { font-weight: 700; margin-right: 8px; }
.studio-header .crumb-sep { color: #6F6F6F; }
.studio-header .crumb { color: #C6C6C6; font-size: 13px; cursor: pointer; }
.studio-header .crumb:hover { color: #fff; }
.studio-header .crumb.current { color: #fff; font-weight: 500; }
.studio-header .ver { font-size: 11px; color: #8D8D8D; padding: 2px 8px; border: 1px solid #393939; border-radius: 999px; margin-left: 8px; font-family: var(--mono); }
.studio-header .right { margin-left: auto; display: flex; align-items: center; gap: 0; }
.studio-header .right .icon-btn { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #C6C6C6; }
.studio-header .right .icon-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
.studio-header .avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: #0353E9; color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-weight: 600; font-size: 12px; margin: 0 8px;
}

/* spacing tokens */
:root {
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px;
  --space-5:24px; --space-6:32px; --space-7:48px;
}

/* === Layout === */
.body { display: flex; min-height: calc(100vh - 48px); }
.sidebar {
  width: 240px; background: var(--surface); border-right: 1px solid var(--border);
  padding: var(--space-3) 0; display: flex; flex-direction: column; gap: 2px;
  transition: width 200ms;
}
.sidebar.collapsed { width: 48px; }
.sidebar.collapsed .nav-label { display: none; }
.sidebar.collapsed .nav-item { justify-content: center; padding: 12px; }
.nav-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 16px; font-size: 13px; font-weight: 400;
  color: var(--text); cursor: pointer; user-select: none;
  border-left: 3px solid transparent;
}
.nav-item:hover { background: var(--surface-alt); }
.nav-item.active { background: var(--surface-alt); border-left-color: var(--accent); font-weight: 500; }
.nav-icon { width: 18px; height: 18px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: var(--text-secondary); }

.main { flex: 1; min-width: 0; background: var(--bg); }

/* === Page sub-header === */
.page-bar {
  display: flex; align-items: center; gap: 12px; padding: 12px 24px;
  background: var(--surface); border-bottom: 1px solid var(--border); flex-wrap: wrap;
}
.page-title { font-size: 14px; font-weight: 500; }
.page-meta { color: var(--text-tertiary); font-size: 12px; font-family: var(--mono); }
.tag-chip {
  padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 500;
  background: var(--surface-2); color: var(--text-secondary);
  font-family: var(--mono);
}
.tag-chip.done { background: var(--success-bg); color: var(--success); }
.tag-chip.warn { background: var(--warning-bg); color: #8a6d00; }
.tag-chip.running { background: var(--accent-bg); color: var(--accent); }
.tag-chip.sample { background: var(--danger); color: #fff; }
.page-bar .right { margin-left: auto; display: flex; align-items: center; gap: 8px; }

.view-switch {
  display: flex; border: 1px solid var(--border); border-radius: 4px; overflow: hidden;
}
.view-switch button {
  padding: 6px 12px; font-size: 12px; color: var(--text-secondary);
  display: flex; align-items: center; gap: 6px; background: var(--surface);
}
.view-switch button.active { background: var(--accent-bg); color: var(--accent); }
.view-switch button:not(:last-child) { border-right: 1px solid var(--border); }

/* === Buttons === */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 8px 16px; font-size: 13px; font-weight: 500;
  border: 1px solid transparent; transition: all 100ms; border-radius: 0;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-primary:disabled { background: var(--border); color: var(--text-tertiary); cursor: not-allowed; }
.btn-secondary { background: var(--surface); border-color: var(--border-strong); color: var(--text); }
.btn-secondary:hover { background: var(--surface-alt); }
.btn-ghost { color: var(--text); padding: 6px 12px; }
.btn-ghost:hover { background: var(--surface-2); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-link { color: var(--accent); padding: 0; }
.btn-link:hover { text-decoration: underline; }
.btn-sm { padding: 5px 10px; font-size: 12px; }
.btn-icon { padding: 6px; border: 1px solid var(--border); background: var(--surface); }
.btn-icon:hover { background: var(--surface-alt); }

/* === Content === */
.content { padding: 24px; }
.content-narrow { max-width: 960px; }

h1 { font-size: 22px; font-weight: 600; margin: 0 0 16px 0; letter-spacing: -0.3px; }
h2 { font-size: 16px; font-weight: 600; margin: 0 0 12px 0; }
h3 { font-size: 14px; font-weight: 600; margin: 0 0 10px 0; }

.card {
  background: var(--surface); border: 1px solid var(--border);
  padding: 20px;
}

.badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 2px 10px; border-radius: 999px;
  background: var(--surface-2); font-size: 11px; font-weight: 500;
  color: var(--text-secondary); font-family: var(--mono);
}
.badge .dot { width: 6px; height: 6px; border-radius: 50%; }

/* === Dashboard === */
.welcome { font-size: 20px; font-weight: 600; margin-bottom: 24px; }
.quick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 32px; }
.quick-card {
  border: 1px solid var(--border); background: var(--surface);
  padding: 24px; cursor: pointer; transition: all 150ms;
}
.quick-card:hover { border-color: var(--accent); }
.quick-card .ico { font-size: 22px; margin-bottom: 8px; color: var(--accent); }
.quick-card .label { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
.quick-card .sub { color: var(--text-tertiary); font-size: 12px; }

.proj-table {
  background: var(--surface); border: 1px solid var(--border);
  margin-bottom: 24px;
}
.proj-row {
  display: grid; grid-template-columns: 40px 1fr 140px 100px 120px;
  align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border);
  cursor: pointer; font-size: 13px;
}
.proj-row.head { background: var(--surface-alt); color: var(--text-tertiary); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; cursor: default; }
.proj-row:hover:not(.head) { background: var(--surface-alt); }
.proj-row:last-child { border-bottom: none; }
.proj-row .ico { font-size: 16px; }
.proj-row .ver-cell { font-family: var(--mono); font-size: 12px; color: var(--text-secondary); }

.counter-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--border); border: 1px solid var(--border); }
.counter-card {
  background: var(--surface); padding: 16px 20px; cursor: pointer;
}
.counter-card:hover { background: var(--surface-alt); }
.counter-card .label { color: var(--text-tertiary); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
.counter-card .num { font-size: 28px; font-weight: 600; font-family: var(--mono); }

/* === Pipeline (DAG) view === */
.pipeline-layout { display: grid; grid-template-columns: 1fr 360px; height: calc(100vh - 48px - 49px); }
.dag-canvas {
  position: relative; background:
    radial-gradient(circle, #D8D8D8 1px, transparent 1px),
    linear-gradient(to bottom, #F4F4F4, #F4F4F4);
  background-size: 24px 24px;
  overflow: auto;
}
.dag-svg-layer {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none;
}
.dag-stage {
  position: absolute; width: 220px; background: var(--surface);
  border: 1px solid var(--border-strong); padding: 12px 14px;
  cursor: pointer; transition: all 150ms; user-select: none;
}
.dag-stage:hover { box-shadow: 0 0 0 1px var(--accent); }
.dag-stage.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); border-top: 4px solid var(--accent); padding-top: 9px; }
.dag-stage.done { border-top: 4px solid var(--success); padding-top: 9px; }
.dag-stage.running { border-top: 4px solid var(--accent); padding-top: 9px; box-shadow: 0 0 0 1px var(--accent); }
.dag-stage.warning { border: 2px dashed var(--warning); background: var(--warning-bg); padding: 11px 13px; }
.dag-stage.queued { opacity: 0.7; }
.dag-stage.input { background: var(--header-bg); color: #fff; border-color: var(--header-bg); }
.dag-stage.input .stage-id { color: #8D8D8D; }
.dag-stage.input .stage-file { color: #C6C6C6; }
.dag-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.stage-id { font-size: 11px; font-family: var(--mono); color: var(--text-tertiary); font-weight: 600; }
.stage-status { font-size: 10px; text-transform: lowercase; font-family: var(--mono); color: var(--text-tertiary); }
.dag-stage.done .stage-status { color: var(--success); }
.dag-stage.running .stage-status { color: var(--accent); }
.dag-stage.warning .stage-status { color: #8a6d00; }
.stage-title { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; margin-bottom: 4px; }
.stage-title .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text); }
.stage-file { font-size: 11px; font-family: var(--mono); color: var(--text-tertiary); }
.dag-port {
  position: absolute; width: 8px; height: 8px; border-radius: 50%;
  background: var(--text); top: 50%; transform: translateY(-50%);
}
.dag-port.left { left: -4px; }
.dag-port.right { right: -4px; }

.dag-controls { position: absolute; bottom: 16px; left: 16px; display: flex; flex-direction: column; gap: 1px; background: var(--border); border: 1px solid var(--border); }
.dag-controls button { width: 32px; height: 32px; background: var(--surface); display: flex; align-items: center; justify-content: center; font-size: 16px; }
.dag-controls button:hover { background: var(--surface-alt); }
.dag-minimap { position: absolute; bottom: 16px; right: 16px; width: 200px; height: 100px; background: var(--surface); border: 1px solid var(--border-strong); padding: 8px; font-size: 9px; color: var(--text-tertiary); font-family: var(--mono); }
.dag-minimap .mm-label { position: absolute; top: 4px; left: 8px; }
.dag-minimap svg { position: absolute; inset: 0; }

/* Inspector */
.dag-inspector { background: var(--surface); border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
.insp-head { padding: 16px 20px; border-bottom: 1px solid var(--border); }
.insp-head .top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.insp-head .stage-badge { font-family: var(--mono); font-size: 11px; font-weight: 600; padding: 3px 8px; background: var(--text); color: var(--surface); }
.insp-head .running-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1.2s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
.insp-head h2 { margin: 0; font-size: 18px; }
.insp-head .cmd { margin-top: 8px; font-family: var(--mono); font-size: 12px; color: var(--text-secondary); background: var(--surface-2); padding: 6px 10px; }

.insp-body { padding: 16px 20px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 20px; }
.insp-section h3 { font-size: 11px; font-weight: 600; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
.insp-row { display: grid; grid-template-columns: 80px 1fr; gap: 12px; padding: 6px 0; font-size: 13px; align-items: start; }
.insp-row .label { color: var(--text-tertiary); }
.insp-row .val { font-family: var(--mono); font-size: 12px; }
.insp-row .val a { color: var(--accent); }
.progress { height: 6px; background: var(--surface-2); border-radius: 0; overflow: hidden; width: 100%; }
.progress > div { height: 100%; background: var(--accent); transition: width 300ms; }

.log-list { display: flex; flex-direction: column; gap: 6px; font-family: var(--mono); font-size: 12px; line-height: 1.4; }
.log-line { display: flex; gap: 8px; align-items: flex-start; }
.log-line .icon { flex-shrink: 0; width: 14px; }
.log-line.ok .icon { color: var(--success); }
.log-line.warn .icon { color: var(--warning); }
.log-line.arrow .icon { color: var(--text-secondary); }

.insp-foot { padding: 12px 20px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; }

/* === Preview screen (A4 sample cards) === */
.preview-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 16px; padding: 16px 24px; }
.preview-panel { background: var(--surface); border: 1px solid var(--border); padding: 16px; }
.preview-panel-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px; }
.preview-panel-head h2 { margin: 0; }
.preview-panel-meta { font-size: 11px; color: var(--text-tertiary); margin-bottom: 16px; font-family: var(--mono); }

.thumb-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.a4-card {
  aspect-ratio: 794/1123; background: #fff; border: 1px solid var(--border);
  padding: 16px 14px; cursor: pointer; transition: all 150ms;
  display: flex; flex-direction: column; gap: 8px;
  overflow: hidden; position: relative;
  font-size: 11px;
}
.a4-card:hover { border-color: var(--accent); }
.a4-card.active { border: 2px solid var(--accent); padding: 15px 13px; }
.a4-card-title { font-size: 13px; font-weight: 700; line-height: 1.35; color: #161616; }
.a4-card-sub { font-size: 10px; color: var(--text-secondary); }
.a4-visual {
  flex: 1; background: #F4F4F4; display: flex;
  align-items: center; justify-content: center; color: var(--text-tertiary);
  font-size: 11px; min-height: 60px;
}
.a4-visual.evidence { background: #EDF5FF; color: var(--accent); }
.a4-card .bullets { font-size: 10px; line-height: 1.5; color: #393939; padding-left: 12px; margin: 0; }
.a4-card .bullets li { list-style-type: disc; }
.a4-card .bullets li::marker { color: var(--accent); }
.a4-card .footnote { font-size: 9px; color: var(--text-tertiary); margin-top: auto; padding-top: 6px; }
.a4-card .price { font-size: 22px; font-weight: 700; color: #161616; }
.a4-card .price-sub { font-size: 10px; color: var(--text-secondary); display: inline-block; margin-left: 6px; }
.a4-card .cta-btn {
  background: var(--accent); color: #fff; padding: 8px;
  text-align: center; font-size: 11px; font-weight: 600;
  margin-top: auto;
}
.a4-card .pill-sample {
  position: absolute; top: 14px; right: 14px;
  background: var(--danger); color: #fff;
  padding: 2px 6px; font-size: 9px; font-weight: 700;
  font-family: var(--mono);
}

.solution-cols { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
.solution-col-title { font-size: 11px; font-weight: 700; color: var(--accent); margin-bottom: 2px; }
.solution-col-sub { font-size: 9px; color: var(--text-secondary); line-height: 1.3; }
.solution-col-bar { height: 100px; background: #F4F4F4; margin-top: 4px; }

.detail-card-wrap { padding: 24px; background: var(--surface-alt); display: flex; align-items: center; justify-content: center; min-height: 700px; }
.detail-card {
  width: min(100%, 460px); aspect-ratio: 794/1123;
  background: #fff; padding: 32px 28px;
  display: flex; flex-direction: column; gap: 16px;
  border: 1px solid var(--border);
}
.detail-card .title { font-size: 22px; font-weight: 700; line-height: 1.35; }
.detail-card .sub { font-size: 14px; color: var(--text-secondary); }
.detail-card .visual { flex: 1; background: #F4F4F4; display: flex; align-items: center; justify-content: center; color: var(--text-tertiary); min-height: 220px; }
.detail-card .visual.evidence { background: #EDF5FF; color: var(--accent); }
.detail-card .price-big { font-size: 36px; font-weight: 700; }
.detail-card .cta-big { background: var(--accent); color: #fff; text-align: center; padding: 14px; font-weight: 600; font-size: 14px; margin-top: auto; }

.preview-panel-actions { display: flex; gap: 8px; align-items: center; }
.preview-panel-actions .btn-icon { padding: 6px 8px; }

/* === Modal / Toast === */
.modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
.modal { background: var(--surface); padding: 24px; max-width: 480px; width: 100%; max-height: 90vh; overflow-y: auto; }
.modal h3 { margin-top: 0; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 24px; }

#toast-root { position: fixed; bottom: 24px; right: 24px; z-index: 200; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.toast { background: var(--text); color: #fff; padding: 12px 16px; font-size: 13px; font-weight: 500; animation: slideIn 250ms ease-out; max-width: 360px; pointer-events: auto; }
.toast.success { background: var(--success); }
.toast.warning { background: #8a6d00; }
.toast.error { background: var(--danger); }
@keyframes slideIn { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

/* === Form === */
.form-field { margin-bottom: 20px; }
.form-field label { display: block; font-weight: 500; margin-bottom: 6px; font-size: 12px; color: var(--text-secondary); }
.form-field input[type="text"], .form-field select {
  width: 100%; padding: 9px 12px; border: 1px solid var(--border-strong);
  background: var(--surface); font-size: 14px;
}
.form-field input[type="text"]:focus { outline: none; border-color: var(--accent); }

.dropzone { border: 1px dashed var(--border-strong); padding: 40px 24px; text-align: center; background: var(--surface); cursor: pointer; }
.dropzone:hover, .dropzone.drag { border-color: var(--accent); background: var(--accent-bg); }

/* === UI6 / Extract === */
.ui6 { display: grid; grid-template-columns: 180px 1fr 360px; gap: 12px; height: calc(100vh - 200px); padding: 0 24px; }
.ui6-pane { background: var(--surface); border: 1px solid var(--border); padding: 14px; overflow-y: auto; }
.pane-title { font-size: 10px; font-weight: 600; text-transform: uppercase; color: var(--text-tertiary); margin-bottom: 12px; letter-spacing: 0.5px; }
.thumb-rail { display: flex; flex-direction: column; gap: 6px; }
.thumb { width: 100%; aspect-ratio: 0.73; background: var(--surface-2); border: 2px solid transparent; display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--text-secondary); cursor: pointer; }
.thumb.active { border-color: var(--accent); color: var(--accent); }
.extracted-text { width: 100%; min-height: 400px; border: none; resize: none; font-family: inherit; font-size: 14px; line-height: 1.6; background: transparent; color: var(--text); outline: none; }
.model-toggle { display: flex; gap: 1px; background: var(--border); margin-bottom: 12px; }
.model-toggle button { flex: 1; padding: 6px 8px; font-size: 12px; font-weight: 500; color: var(--text-secondary); background: var(--surface); }
.model-toggle button.active { background: var(--accent); color: #fff; }
.prompt-box { width: 100%; min-height: 240px; border: 1px solid var(--border); padding: 12px; font-family: var(--mono); font-size: 12px; line-height: 1.5; background: var(--surface-alt); color: var(--text); resize: vertical; outline: none; }

/* === Tab bar === */
.tab-bar { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
.tab { padding: 10px 16px; font-size: 13px; font-weight: 500; color: var(--text-secondary); border-bottom: 3px solid transparent; margin-bottom: -1px; }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

/* === Blocks list === */
.block-list { display: flex; flex-direction: column; gap: 0; border: 1px solid var(--border); background: var(--surface); }
.block-row { display: grid; grid-template-columns: 30px 14px 90px 1fr 60px; gap: 12px; align-items: center; padding: 12px 16px; font-size: 13px; border-bottom: 1px solid var(--border); }
.block-row:last-child { border-bottom: none; }
.block-row .type-dot { width: 10px; height: 10px; border-radius: 50%; }
.block-row .type-label { font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--text-secondary); font-family: var(--mono); }

.recipe-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 24px; }
.recipe-card { background: var(--surface); border: 1px solid var(--border); padding: 20px; cursor: pointer; transition: all 150ms; display: flex; flex-direction: column; }
.recipe-card:hover { border-color: var(--accent); }
.recipe-card.selected { border-color: var(--accent); border-top: 4px solid var(--accent); padding-top: 17px; background: var(--accent-bg); }

/* === Responsive === */
@media (max-width: 1023px) {
  .pipeline-layout { grid-template-columns: 1fr 320px; }
  .preview-layout { grid-template-columns: 1fr; }
}
@media (max-width: 767px) {
  .sidebar { position: fixed; left: -240px; top: 48px; bottom: 0; z-index: 40; transition: left 200ms; }
  .sidebar.mobile-open { left: 0; }
  .pipeline-layout { grid-template-columns: 1fr; height: auto; }
  .dag-inspector { border-left: none; border-top: 1px solid var(--border); }
  .ui6 { grid-template-columns: 1fr; height: auto; }
  .quick-grid { grid-template-columns: 1fr; }
  .counter-grid { grid-template-columns: repeat(2, 1fr); }
  .recipe-grid { grid-template-columns: 1fr; }
  .thumb-grid { grid-template-columns: 1fr; }
  .proj-row { grid-template-columns: 30px 1fr 100px; }
  .proj-row .ver-cell, .proj-row .time-cell { display: none; }
}

.empty { text-align: center; padding: 48px 24px; color: var(--text-tertiary); }
.empty .ico { font-size: 36px; margin-bottom: 12px; opacity: 0.4; }
.empty h3 { color: var(--text); }

function timeAgo(ts) {
  const d = Date.now() - ts;
  const h = Math.floor(d / 3600000);
  if (h < 1) return '방금 전';
  if (h < 24) return h + '시간 전';
  return Math.floor(h/24) + '일 전';
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ============ TOAST ============
function showToast(msg, type='info') {
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 200ms'; setTimeout(() => el.remove(), 200); }, 3000);
}

function screenPipeline(pid) {
  const proj = state.projects.find(p => p.id === pid) || state.projects[1];
  const meta = state.pipelineMeta;
  const stages = state.dagStages;
  const edges = state.dagEdges;
  const insp = state.dagInspector[state.currentDagStage] || state.dagInspector.F3;
  const W = 1560, H = 540;

  const stageById = Object.fromEntries(stages.map(s => [s.id, s]));
  const edgePath = (e) => {
    const from = stageById[e.from], to = stageById[e.to];
    if (!from || !to) return '';
    const fw = from.w || 220, tw = to.w || 220;
    const x1 = from.x + fw, y1 = from.y + 36;
    const x2 = to.x, y2 = to.y + 36;
    const c1x = x1 + 60, c2x = x2 - 60;
    return `M ${x1} ${y1} C ${c1x} ${y1}, ${c2x} ${y2}, ${x2} ${y2}`;
  };

  return `
    <div class="page-bar">
      <div class="page-title">파이프라인 · ${esc(meta.name)}</div>
      <span class="tag-chip">${esc(meta.ver)}</span>
      ${meta.chips.map(c => `<span class="tag-chip ${c.cls}">${esc(c.label)}</span>`).join('')}
      <div class="right">
        <div class="view-switch">
          <button class="active" data-action="dag-view"><svg width="14" height="14" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2"><circle cx="16" cy="16" r="11"/><circle cx="16" cy="16" r="3" fill="currentColor"/></svg> DAG</button>
          <button><svg width="14" height="14" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2"><line x1="6" y1="8" x2="26" y2="8"/><line x1="6" y1="16" x2="26" y2="16"/><line x1="6" y1="24" x2="26" y2="24"/></svg> List</button>
          <button><svg width="14" height="14" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2"><circle cx="16" cy="16" r="12"/><path d="M16 10v6l4 2"/></svg> Logs</button>
        </div>
        <button class="btn btn-ghost btn-sm">설정</button>
        <button class="btn btn-primary btn-sm" data-action="open-modal" data-key="confirm-rerun">파이프라인 재실행 ▷</button>
      </div>
    </div>
    <div class="pipeline-layout">
      <div class="dag-canvas">
        <svg class="dag-svg-layer" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMinYMin meet" style="width:${W}px;height:${H}px">
          ${edges.map(e => `<path d="${edgePath(e)}" fill="none" stroke="${e.color || '#393939'}" stroke-width="${e.dashed?'2':'1.5'}" ${e.dashed?'stroke-dasharray="6 4"':''} marker-end="url(#arrowend)"/>`).join('')}
          <defs><marker id="arrowend" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#393939"/></marker></defs>
        </svg>
        ${stages.map(s => {
          const active = s.id === state.currentDagStage;
          const cls = `${s.kind === 'input' ? 'input' : ''} ${s.status} ${active && s.status !== 'input' ? 'active' : ''}`;
          const w = s.w || 220;
          return `
            <div class="dag-stage ${cls}" style="left:${s.x}px;top:${s.y}px;width:${w}px"
                 data-action="select-stage" data-id="${s.id}">
              ${s.noLeft ? '' : '<div class="dag-port left"></div>'}
              ${s.id === 'F5' ? '' : '<div class="dag-port right"></div>'}
              <div class="dag-head">
                <span class="stage-id">${s.noId ? '' : s.id}</span>
                <span class="stage-status">${s.warningIcon ? '⚠ ' : ''}${s.status}</span>
              </div>
              <div class="stage-title"><span class="dot"></span>${esc(s.title)}</div>
              <div class="stage-file">${esc(s.file)}</div>
            </div>`;
        }).join('')}

        <div class="dag-controls">
          <button title="확대">＋</button>
          <button title="축소">－</button>
          <button title="맞춤">⊡</button>
          <button title="새로고침">↻</button>
        </div>
        <div class="dag-minimap">
          <div class="mm-label">MINIMAP</div>
          <svg width="100%" height="100%" viewBox="0 0 200 100">
            <g stroke="#8D8D8D" stroke-width="1" fill="#8D8D8D">
              <line x1="20" y1="55" x2="50" y2="55"/>
              <rect x="44" y="51" width="8" height="8"/>
              <line x1="58" y1="55" x2="85" y2="55"/>
              <rect x="82" y="30" width="8" height="8"/>
              <rect x="82" y="76" width="8" height="8"/>
              <line x1="90" y1="55" x2="115" y2="55"/>
              <rect x="113" y="51" width="8" height="8" fill="#0F62FE" stroke="#0F62FE"/>
              <line x1="123" y1="55" x2="148" y2="55"/>
              <rect x="146" y="51" width="8" height="8"/>
              <line x1="156" y1="55" x2="180" y2="55"/>
              <rect x="178" y="51" width="8" height="8"/>
            </g>
          </svg>
        </div>
      </div>

      <aside class="dag-inspector">
        <div class="insp-head">
          <div class="top">
            <span class="stage-badge">${insp.id}</span>
            <span class="running-dot"></span>
            <span style="font-size:12px;color:var(--accent);font-weight:500">${insp.status}</span>
          </div>
          <h2>${esc(insp.title)}</h2>
          <div class="cmd">${esc(insp.cmd)}</div>
        </div>
        <div class="insp-body">
          <div class="insp-section">
            <h3>실행 상태</h3>
            <div class="insp-row"><div class="label">진행률</div><div class="val"><div class="progress"><div style="width:${insp.progress}%"></div></div><div style="margin-top:4px;text-align:right">${insp.progress}%</div></div></div>
            <div class="insp-row"><div class="label">실행 시간</div><div class="val">${esc(insp.runtime)}</div></div>
            <div class="insp-row"><div class="label">산출물</div><div class="val"><a href="#" onclick="event.preventDefault()">${esc(insp.output)}</a></div></div>
            <div class="insp-row"><div class="label">에러</div><div class="val">${esc(insp.errors)}</div></div>
          </div>
          <div class="insp-section">
            <h3>입력 / 출력</h3>
            <div class="insp-row"><div class="label">입력</div><div class="val">${insp.input.map(esc).join('<br>')}</div></div>
            <div class="insp-row"><div class="label">출력</div><div class="val"><a href="#" onclick="event.preventDefault()">${esc(insp.outputFile)}</a></div></div>
          </div>
          <div class="insp-section">
            <h3>최근 로그</h3>
            <div class="log-list">
              ${insp.logs.map(l => `<div class="log-line ${l.cls}"><span class="icon">${l.icon}</span><span>${esc(l.text)}</span></div>`).join('')}
            </div>

        </div>
        <div class="insp-foot">
          <button class="btn-link" data-action="pause">일시정지</button>
          <button class="btn btn-primary btn-sm" data-action="rerun-stage">재실행 ▷</button>

    </div>`;
}

// ============ PREVIEW (A4 sample cards) ============
function renderA4Card(p, opts={}) {
  const big = opts.big;
  const cls = big ? 'detail-card' : `a4-card ${opts.active?'active':''}`;
  const titleCls = big ? 'title' : 'a4-card-title';
  const subCls = big ? 'sub' : 'a4-card-sub';
  const visualCls = big ? 'visual' : 'a4-visual';
  const dataAttrs = !big ? `data-action="set-preview-page" data-i="${opts.i}"` : '';

  let body = '';
  if (p.type === 'hook') {
    body = `<div class="${titleCls}">${esc(p.title)}</div>
      <div class="${subCls}">${esc(p.sub)}</div>
      <div class="${visualCls}">${esc(p.visualLabel)}</div>`;
  } else if (p.type === 'problem') {
    body = `<div class="${titleCls}">${esc(p.title)}</div>
      <ul class="bullets">${p.bullets.map(b => `<li>${esc(b)}</li>`).join('')}</ul>
      <div class="${visualCls}">${esc(p.visualLabel)}</div>`;
  } else if (p.type === 'solution') {
    body = `<div class="${titleCls}">${esc(p.title)}</div>
      <div class="solution-cols">${p.cols.map(c => `
        <div>
          <div class="solution-col-title">${esc(c.name)}</div>
          <div class="solution-col-sub">${esc(c.sub)}</div>
          <div class="solution-col-bar" style="${big?'height:240px':''}"></div>
        </div>`).join('')}</div>`;
  } else if (p.type === 'proof' || p.type === 'review') {
    body = `<div class="${titleCls}" style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
        <span>${esc(p.title)}</span>
        ${p.sample ? '<span class="pill-sample" style="position:static">SAMPLE</span>' : ''}
      </div>
      <div class="${visualCls} evidence">${esc(p.evidenceVisual)}</div>
      <div class="footnote">${esc(p.foot)}</div>`;
  } else if (p.type === 'offer') {
    body = `<div class="${titleCls}">${esc(p.title)}</div>
      <div>
        <span class="${big?'price-big':'price'}">${esc(p.price)}</span>
        <span class="price-sub">${esc(p.priceSub)}</span>
      </div>
      <ul class="bullets">${p.bullets.map(b => `<li>${esc(b)}</li>`).join('')}</ul>
      <div class="${big?'cta-big':'cta-btn'}">${esc(p.cta)}</div>`;
  }
  return `<div class="${cls}" ${dataAttrs}>${body}</div>`;
}

      <div class="page-title">최종 산출 · ${esc(proj?.name || '')}</div>
      <span class="tag-chip done">24개 파일</span>
      <div class="right"><button class="btn btn-primary btn-sm" data-action="download-all">💾 전체 ZIP</button></div>
    </div>
    <div class="content">
      ${groups.map(g => `
        <div class="card" style="margin-bottom:12px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
            <strong>${esc(g.name)}</strong>
            <div style="display:flex;gap:12px;align-items:center">
              <span class="page-meta">${g.count}개 · ${esc(g.size)}</span>
              <button class="btn btn-secondary btn-sm" data-action="download">ZIP</button>
            </div>
          </div>
          <div style="font-family:var(--mono);font-size:12px;color:var(--text-tertiary)">
            ${Array.from({length:Math.min(3,g.count)},(_,i)=>`└ page_${String(i+1).padStart(3,'0')}.${g.ext.toLowerCase()}`).join('<br>')}
            ${g.count>3?`<br>└ ... +${g.count-3}개`:''}
          </div>
        </div>`).join('')}
    </div>`;
}

  return `
    <div class="page-bar"><div class="page-title">자료실</div></div>
    <div class="content">
      <div class="tab-bar">
        <button class="tab active">텍스트 블록 (12)</button>
        <button class="tab">디자인 블록 (4)</button>
        <button class="tab">채널 어댑터 (9)</button>
        <button class="tab">레시피 (5)</button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">
        ${state.textBlocks.map(b => `
          <div class="card">
            <div style="display:flex;align-items:center;gap:6px;margin-bottom:10px">
              <span class="type-dot" style="width:8px;height:8px;border-radius:50%;background:${TYPE_VAR[b.type]||'var(--text-tertiary)'}"></span>
              <span class="type-label">${b.type}</span>
            </div>
            <p style="font-size:13px;margin:0 0 10px">${esc(b.text)}</p>
            <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-tertiary)">
              <span>TRUSTA Glow Serum</span>
              <button class="btn-link btn-sm">📋</button>
            </div>
          </div>`).join('')}

    </div>`;
}

function screenPromptsGlobal() {
  return `
    <div class="page-bar"><div class="page-title">글로벌 프롬프트 템플릿</div></div>
    <div class="content">
      <p style="color:var(--text-secondary)">모든 프로젝트의 기본값이 되는 프롬프트.</p>
      <div class="block-list">
        <div class="block-row" style="grid-template-columns:30px 1fr 90px 60px"><span>📄</span><span style="font-family:var(--mono);font-size:12px">extract_default.md</span><span class="tag-chip running">global</span><button class="btn-link btn-sm">편집</button></div>
        <div class="block-row" style="grid-template-columns:30px 1fr 90px 60px"><span>📄</span><span style="font-family:var(--mono);font-size:12px">classify_default.md</span><span class="tag-chip running">global</span><button class="btn-link btn-sm">편집</button></div>
        <div class="block-row" style="grid-template-columns:30px 1fr 90px 60px"><span>📄</span><span style="font-family:var(--mono);font-size:12px">style_minimal.md</span><span class="tag-chip">block</span><button class="btn-link btn-sm">편집</button></div>
        <div class="block-row" style="grid-template-columns:30px 1fr 90px 60px"><span>📄</span><span style="font-family:var(--mono);font-size:12px">image_elem_default.md</span><span class="tag-chip">asset</span><button class="btn-link btn-sm">편집</button></div>
      </div>
    </div>`;

function screenSettings() {
  return `
    <div class="page-bar"><div class="page-title">설정</div></div>
    <div class="content content-narrow">
      <div class="card" style="margin-bottom:12px">
        <h3>기본 모델</h3>
        <div class="model-toggle" style="max-width:280px;margin-top:10px">
          <button class="${state.currentModel==='claude'?'active':''}" data-action="set-model" data-m="claude">Claude</button>
          <button class="${state.currentModel==='gpt'?'active':''}" data-action="set-model" data-m="gpt">GPT</button>
          <button class="${state.currentModel==='gemini'?'active':''}" data-action="set-model" data-m="gemini">Gemini</button>
        </div>
      </div>
      <div class="card" style="margin-bottom:12px">
        <h3>데이터</h3>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px">
          <div>
            <div>전체 데이터 초기화</div>
            <div style="font-size:12px;color:var(--text-tertiary)">localStorage를 비웁니다.</div>
          </div>
          <button class="btn btn-danger btn-sm" data-action="reset-data">초기화</button>
        </div>
      </div>
      <div class="card">
        <h3>정보</h3>
        <div style="font-family:var(--mono);font-size:12px;color:var(--text-tertiary);margin-top:10px">A4 Pipeline Studio v0.2 — Prototype<br>Built with vanilla JS, offline-ready, no external dependencies.</div>
      </div>
    </div>`;
}

// ============ ROUTER ============
function render() {
  const hash = location.hash || '#/dashboard';
  let content = '', opts = {};
  const projMatch = hash.match(/^#\/project\/([^/]+)\/(\w+)$/);
  if (hash === '#/' || hash === '#/dashboard') content = screenDashboard();
  else if (projMatch) {
    const [, pid, step] = projMatch;
    opts.project = state.projects.find(p => p.id === pid);
    if (step === 'pipeline') content = screenPipeline(pid);
    else if (step === 'extract') content = screenExtract(pid);
    else if (step === 'classify') content = screenClassify(pid);
    else if (step === 'prompts') content = screenPrompts(pid);
    else if (step === 'recipe') content = screenRecipe(pid);
    else if (step === 'preview') content = screenPreview(pid);
    else if (step === 'export') content = screenExport(pid);
    else content = screenPipeline(pid);
  }
  else if (hash === '#/library') content = screenLibrary();
  else if (hash === '#/prompts-global') content = screenPromptsGlobal();
  else if (hash === '#/settings') content = screenSettings();
  else content = screenDashboard();
  document.getElementById('app').innerHTML = renderShell(content, opts);
}

// ============ EVENTS ============
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-action], [data-route]');
  if (!t) return;
  const r = t.getAttribute('data-route');
  if (r) { location.hash = r; state.mobileSidebarOpen = false; saveState(); return; }
  const a = t.getAttribute('data-action');
  if (a) handleAction(a, t, e);
});

function handleAction(a, t) {
  switch(a) {
    case 'toggle-sidebar':
      if (window.innerWidth < 768) state.mobileSidebarOpen = !state.mobileSidebarOpen;
      else state.sidebarCollapsed = !state.sidebarCollapsed;
      saveState(); render(); break;
    case 'show-shortcuts': openModal('shortcuts'); break;
    case 'open-modal': openModal(t.getAttribute('data-key')); break;
    case 'modal-close': case 'modal-backdrop': closeModal(); break;
    case 'modal-create-project': {
      const name = document.getElementById('m-name')?.value || '새 프로젝트';
      const id = 'p' + Date.now();
      state.projects.unshift({ id, name, ver: 'v0.1', stage: 'extracting', updatedAt: Date.now() });
      saveState(); closeModal();
      location.hash = `#/project/${id}/pipeline`;
      break;
    }
    case 'modal-confirm-rerun':
      closeModal();
      showToast('파이프라인 재실행 시작', 'success');
      break;
    case 'open-project': {
      const pid = t.getAttribute('data-pid');
      location.hash = `#/project/${pid}/pipeline`;
      break;
    }
    case 'filter-stage': {
      const s = t.getAttribute('data-stage');
      const n = state.projects.filter(p => p.stage === s).length;
      showToast(`${STAGE_LABEL[s]} 프로젝트 ${n}개`, 'info');
      break;
    }
    case 'select-stage':
      state.currentDagStage = t.getAttribute('data-id');
      saveState(); render(); break;
    case 'pause': showToast('일시정지됨', 'warning'); break;
    case 'rerun-stage': showToast('재실행 시작', 'success'); break;
    case 'set-page':
      state.currentExtractPage = parseInt(t.getAttribute('data-i'), 10);
      saveState(); render(); break;
    case 'set-model':
      state.currentModel = t.getAttribute('data-m');
      saveState(); render(); break;
    case 'copy-prompt':
      try { navigator.clipboard.writeText(state.extractPrompts[state.currentModel]); } catch(e){}
      showToast('복사됨', 'success'); break;
    case 'reset-prompt': showToast('기본 템플릿으로 복원', 'info'); break;
    case 'set-classify-tab':
      state.currentClassifyTab = t.getAttribute('data-t');
      saveState(); render(); break;
    case 'toggle-block': {
      const bid = t.getAttribute('data-bid');
      const b = state.textBlocks.find(x => x.id === bid);
      if (b) b.selected = !b.selected;
      saveState(); render(); break;
    }
    case 'set-prompt-file':
      state.currentPromptFile = t.getAttribute('data-id');
      saveState(); render(); break;
    case 'save-prompt': {
      const f = state.prompts[state.currentPromptFile];
      if (f) f.modified = true;
      saveState(); render();
      showToast('저장됨', 'success'); break;
    }
    case 'select-recipe':
      state.selectedRecipe = t.getAttribute('data-id');
      saveState(); render(); break;
    case 'set-channel':
      state.currentChannelTab = t.getAttribute('data-id');
      saveState(); render(); break;
    case 'set-preview-page':
      state.currentPreviewPage = parseInt(t.getAttribute('data-i'), 10);
      saveState(); render(); break;
    case 'rerender':
      showToast('재렌더 중...', 'info');
      setTimeout(() => showToast('재렌더 완료', 'success'), 800);
      break;
    case 'download': showToast('다운로드 시작 (데모)', 'info'); break;
    case 'download-all': showToast('전체 ZIP 다운로드 시작 (데모)', 'info'); break;
    case 'reset-data':
      if (confirm('모든 데이터를 초기화할까요?')) {
        localStorage.removeItem('a4pf_state');
        state = JSON.parse(JSON.stringify(INITIAL_STATE));
        render(); showToast('초기화 완료', 'warning');
      }
      break;
  }
}

document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.classList.contains('extracted-text')) {
    const cur = state.extractedPages[state.currentExtractPage];
    if (cur) cur.text = t.value;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => { saveState(); showToast('자동 저장됨', 'success'); }, 800);
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
  if (e.key === '?' && !e.target.matches('input, textarea')) openModal('shortcuts');
  if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); showToast('저장됨', 'success'); }
  if (e.key === 'ArrowRight') {
    if (location.hash.includes('/extract')) {
      state.currentExtractPage = Math.min(state.extractedPages.length-1, state.currentExtractPage+1);
      saveState(); render();
    } else if (location.hash.includes('/preview')) {
      state.currentPreviewPage = Math.min(state.a4Pages.length-1, state.currentPreviewPage+1);
      saveState(); render();
    }
  }
  if (e.key === 'ArrowLeft') {
    if (location.hash.includes('/extract')) {
      state.currentExtractPage = Math.max(0, state.currentExtractPage-1);
      saveState(); render();
    } else if (location.hash.includes('/preview')) {
      state.currentPreviewPage = Math.max(0, state.currentPreviewPage-1);
      saveState(); render();
    }
  }
});

window.addEventListener('hashchange', render);
window.addEventListener('load', render);
window.addEventListener('resize', () => { if (window.innerWidth >= 768) state.mobileSidebarOpen = false; });
render();
</script>
</body>
</html>
